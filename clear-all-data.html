<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>清除所有数据 - SunStudio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            padding: 40px;
        }
        
        h1 {
            font-size: 28px;
            color: #1a202c;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 18px;
        }
        
        .subtitle {
            color: #718096;
            font-size: 14px;
            margin-bottom: 32px;
        }
        
        .warning {
            background: #fff5f5;
            border: 2px solid #fc8181;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 24px;
        }
        
        .warning-title {
            color: #c53030;
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .warning-text {
            color: #742a2a;
            font-size: 14px;
            line-height: 1.6;
        }
        
        .info {
            background: #ebf8ff;
            border: 2px solid #63b3ed;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 24px;
        }
        
        .info-title {
            color: #2c5282;
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 8px;
        }
        
        .info-text {
            color: #2c5282;
            font-size: 14px;
            line-height: 1.6;
        }
        
        .info-list {
            margin-top: 12px;
            padding-left: 20px;
        }
        
        .info-list li {
            color: #2c5282;
            font-size: 14px;
            line-height: 1.8;
        }
        
        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }
        
        button {
            flex: 1;
            padding: 14px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .btn-danger {
            background: linear-gradient(135deg, #f56565 0%, #c53030 100%);
            color: white;
        }
        
        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(245, 101, 101, 0.4);
        }
        
        .btn-danger:active {
            transform: translateY(0);
        }
        
        .btn-secondary {
            background: #e2e8f0;
            color: #4a5568;
        }
        
        .btn-secondary:hover {
            background: #cbd5e0;
        }
        
        .result {
            margin-top: 24px;
            padding: 20px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.6;
            display: none;
        }
        
        .result.success {
            background: #f0fff4;
            border: 2px solid #68d391;
            color: #22543d;
            display: block;
        }
        
        .result.error {
            background: #fff5f5;
            border: 2px solid #fc8181;
            color: #742a2a;
            display: block;
        }
        
        .result-title {
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 8px;
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }
        
        .loading.active {
            display: block;
        }
        
        .spinner {
            border: 3px solid #e2e8f0;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 12px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>
            <div class="icon">🗑️</div>
            清除所有数据
        </h1>
        <div class="subtitle">SunStudio 数据清理工具</div>
        
        <div class="warning">
            <div class="warning-title">
                ⚠️ 警告：此操作不可撤销
            </div>
            <div class="warning-text">
                此操作将清除所有本地数据，包括：<br>
                • 画布上的所有节点和连接<br>
                • 资产库中的所有资产<br>
                • 历史记录中的所有图片<br>
                • IndexedDB 中的所有图片数据<br>
                <br>
                <strong>清除后无法恢复，请谨慎操作！</strong>
            </div>
        </div>
        
        <div class="info">
            <div class="info-title">
                💡 为什么需要清除数据？
            </div>
            <div class="info-text">
                如果你遇到以下问题，可能需要清除数据：
            </div>
            <ul class="info-list">
                <li>刷新后图片显示为空白或报错</li>
                <li>九宫格节点显示 ERR_FILE_NOT_FOUND 错误</li>
                <li>数据持久化修复后，旧数据无法恢复</li>
                <li>想要重新开始，清空所有工作</li>
            </ul>
        </div>
        
        <div class="button-group">
            <button class="btn-secondary" onclick="window.close()">取消</button>
            <button class="btn-danger" onclick="clearAllData()">确认清除</button>
        </div>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <div>正在清除数据...</div>
        </div>
        
        <div class="result" id="result"></div>
    </div>
    
    <script>
        async function clearAllData() {
            const loading = document.getElementById('loading');
            const result = document.getElementById('result');
            
            // 显示加载状态
            loading.classList.add('active');
            result.style.display = 'none';
            
            try {
                let clearedItems = [];
                
                // 1. 清除 localStorage
                const localStorageKeys = Object.keys(localStorage);
                localStorage.clear();
                clearedItems.push(`localStorage: ${localStorageKeys.length} 项`);
                
                // 2. 清除 IndexedDB
                const dbName = 'sunstudio_db';
                const deleteRequest = indexedDB.deleteDatabase(dbName);
                
                await new Promise((resolve, reject) => {
                    deleteRequest.onsuccess = () => {
                        clearedItems.push(`IndexedDB: ${dbName} 数据库`);
                        resolve();
                    };
                    deleteRequest.onerror = () => reject(deleteRequest.error);
                    deleteRequest.onblocked = () => {
                        console.warn('IndexedDB 删除被阻止，请关闭所有标签页后重试');
                        reject(new Error('删除被阻止'));
                    };
                });
                
                // 3. 清除 sessionStorage
                const sessionStorageKeys = Object.keys(sessionStorage);
                sessionStorage.clear();
                clearedItems.push(`sessionStorage: ${sessionStorageKeys.length} 项`);
                
                // 隐藏加载状态
                loading.classList.remove('active');
                
                // 显示成功结果
                result.className = 'result success';
                result.innerHTML = `
                    <div class="result-title">✅ 清除成功</div>
                    <div>已清除以下数据：</div>
                    <ul style="margin-top: 8px; padding-left: 20px;">
                        ${clearedItems.map(item => `<li>${item}</li>`).join('')}
                    </ul>
                    <div style="margin-top: 12px;">
                        <strong>请刷新页面（F5）以重新开始。</strong>
                    </div>
                `;
                
                // 3秒后自动刷新
                setTimeout(() => {
                    window.location.href = '/';
                }, 3000);
                
            } catch (error) {
                // 隐藏加载状态
                loading.classList.remove('active');
                
                // 显示错误结果
                result.className = 'result error';
                result.innerHTML = `
                    <div class="result-title">❌ 清除失败</div>
                    <div>错误信息：${error.message}</div>
                    <div style="margin-top: 12px;">
                        <strong>建议：</strong><br>
                        1. 关闭所有 SunStudio 标签页<br>
                        2. 重新打开此工具<br>
                        3. 再次尝试清除
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
