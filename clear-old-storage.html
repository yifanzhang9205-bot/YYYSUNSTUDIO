<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>清除旧存储数据</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      max-width: 600px;
      margin: 50px auto;
      padding: 20px;
      background: #f5f5f5;
    }
    .container {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h1 {
      color: #333;
      margin-bottom: 20px;
    }
    .info {
      background: #e3f2fd;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      border-left: 4px solid #2196f3;
    }
    .warning {
      background: #fff3e0;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      border-left: 4px solid #ff9800;
    }
    button {
      background: #2196f3;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      margin-right: 10px;
    }
    button:hover {
      background: #1976d2;
    }
    button.danger {
      background: #f44336;
    }
    button.danger:hover {
      background: #d32f2f;
    }
    .result {
      margin-top: 20px;
      padding: 15px;
      border-radius: 8px;
      display: none;
    }
    .result.success {
      background: #e8f5e9;
      border-left: 4px solid #4caf50;
      display: block;
    }
    .result.error {
      background: #ffebee;
      border-left: 4px solid #f44336;
      display: block;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🧹 清除旧存储数据</h1>
    
    <div class="info">
      <strong>📋 说明：</strong><br>
      persist 中间件已修复，需要清除旧的错误数据才能正常使用。
    </div>
    
    <div class="warning">
      <strong>⚠️ 警告：</strong><br>
      清除后，当前页面的节点数据将丢失（但不影响已保存到 IndexedDB 的图片）。<br>
      建议在清除前备份重要数据。
    </div>
    
    <button onclick="clearStorage()">清除 localStorage</button>
    <button onclick="clearAll()" class="danger">清除所有数据</button>
    <button onclick="checkStorage()">检查存储状态</button>
    
    <div id="result" class="result"></div>
  </div>

  <script>
    function clearStorage() {
      try {
        // 清除节点存储
        localStorage.removeItem('canvas-nodes-storage');
        
        showResult('success', '✅ localStorage 已清除！\n\n请刷新页面以应用修复。');
      } catch (error) {
        showResult('error', '❌ 清除失败：' + error.message);
      }
    }

    async function clearAll() {
      if (!confirm('⚠️ 确认清除所有数据？\n\n这将删除：\n- 节点元数据（localStorage）\n- 图片数据（IndexedDB）\n- 资产库数据\n- 历史记录\n\n此操作不可恢复！')) {
        return;
      }

      try {
        // 清除 localStorage
        localStorage.clear();
        
        // 清除 IndexedDB
        const databases = await indexedDB.databases();
        for (const db of databases) {
          if (db.name) {
            indexedDB.deleteDatabase(db.name);
          }
        }
        
        showResult('success', '✅ 所有数据已清除！\n\n请刷新页面。');
      } catch (error) {
        showResult('error', '❌ 清除失败：' + error.message);
      }
    }

    function checkStorage() {
      try {
        const keys = Object.keys(localStorage);
        const nodeStorage = localStorage.getItem('canvas-nodes-storage');
        
        let message = '📊 存储状态：\n\n';
        message += `localStorage 键数量：${keys.length}\n`;
        message += `节点存储：${nodeStorage ? '存在' : '不存在'}\n\n`;
        
        if (nodeStorage) {
          try {
            const data = JSON.parse(nodeStorage);
            message += `节点数据结构：\n${JSON.stringify(data, null, 2).substring(0, 200)}...\n`;
          } catch (e) {
            message += `节点数据格式错误：${e.message}\n`;
          }
        }
        
        showResult('success', message);
      } catch (error) {
        showResult('error', '❌ 检查失败：' + error.message);
      }
    }

    function showResult(type, message) {
      const result = document.getElementById('result');
      result.className = `result ${type}`;
      result.textContent = message;
    }
  </script>
</body>
</html>
